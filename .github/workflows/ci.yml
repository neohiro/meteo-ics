name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python tests/run_tests.py

  lint:
    name: Script lint (brace/paren/bracket balance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check balance
        run: python tests/lint_balance.py

  js:
    name: JS unit tests (real gcalweather.gs / icalweather.gs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Python suite mirrors the Apps Script functions by hand, so a bug
      # present only in the shipped .gs file would pass it. This job extracts
      # and executes the real declarations instead.
      - name: Run JS harness
        run: node tests/js_harness.js
